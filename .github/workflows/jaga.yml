name: jaga

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-gate:
    if: github.event_name == 'pull_request'
    uses: Emil-02/jaga/.github/workflows/jaga-pr.yml@main
    with:
      strict: true
      fail-on: high

  report:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.JAGA_PAT }}
      - uses: Emil-02/jaga@main
        with:
          report: "true"
          badge: "true"
      - name: Commit laporan
        run: |
          git config user.name "emil rahmat"
          git config user.email "189325051+Emil-02@users.noreply.github.com"
          git add jaga-report.json badge.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(jaga): update report"
            git push
          fi
